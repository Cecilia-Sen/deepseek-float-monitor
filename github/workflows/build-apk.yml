name: Build DeepSeek Floating Monitor APK
on:
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Show files
        run: find . -name "*.gradle*" -not -path "./.git/*" | head -20
      - name: Build debug APK
        run: |
          S=$(find . \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          echo "Project: $S"
          cd "$(dirname "$S")"
          if [ -f ./gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug; else gradle assembleDebug; fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
