name: Build DeepSeek Floating Monitor APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Auto-Unzip Mobile Uploaded Zip (if present)
        run: |
          if [ -f "deepseek_android_floating_app.zip" ]; then
            unzip -o deepseek_android_floating_app.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: ./android-kotlin-app
        run: gradle assembleDebug

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-FloatMonitor-Android-APK
          path: android-kotlin-app/app/build/outputs/apk/debug/*.apk
